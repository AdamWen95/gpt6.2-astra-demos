# Replace the example domain and document root before using this template.
server {
    listen 80;
    server_name demos.example.com;
    root /var/www/gpt6.2-astra-demos/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
